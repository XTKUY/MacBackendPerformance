[package]
name = "neko-perf"
version = "0.1.0"
edition = "2021"
description = "Apple Silicon 性能记录器：记录 CPU/GPU/内存/电源事件，事后用 TUI 检查"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.37"
macmon = { version = "0.8", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
ctrlc = "3"

[profile.release]
lto = true
strip = true
